<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px; height: 630px;
  background: linear-gradient(135deg, #0a0a0f 0%, #1a0a0a 50%, #0a0a1a 100%);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  padding: 50px; position: relative; overflow: hidden;
}
body::before {
  content: ''; position: absolute; top: -30%; left: -10%; width: 120%; height: 160%;
  background:
    radial-gradient(ellipse at 20% 40%, rgba(255,107,53,0.14) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 60%, rgba(52,152,219,0.08) 0%, transparent 50%);
}
.week-badge {
  display: inline-block;
  background: rgba(255,107,53,0.15);
  border: 1px solid rgba(255,107,53,0.35);
  padding: 6px 18px;
  border-radius: 20px;
  font-size: 13px;
  color: #ff6b35;
  letter-spacing: 3px;
  margin-bottom: 24px;
  position: relative;
}
h1 {
  font-size: 58px;
  font-weight: 800;
  background: linear-gradient(135deg, #ff6b35, #ffae6a, #ff6b35);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  position: relative;
  letter-spacing: 3px;
}
.date-range { font-size: 18px; color: rgba(255,255,255,0.5); margin-top: 8px; position: relative; letter-spacing: 1px; }
.divider { width: 60px; height: 2px; background: linear-gradient(90deg, #ff6b35, transparent); margin-top: 26px; position: relative; }
.insight {
  font-size: 20px;
  color: rgba(255,255,255,0.7);
  margin-top: 28px;
  max-width: 820px;
  text-align: center;
  line-height: 1.6;
  position: relative;
  font-weight: 500;
}
.footer-text { position: absolute; bottom: 30px; font-size: 13px; color: rgba(255,255,255,0.25); letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="week-badge">WEEKLY REPORT · 第31周</div>
  <h1>AI 周报</h1>
  <div class="date-range">2026.7.27 — 8.2</div>
  <div class="divider"></div>
  <div class="insight">英伟达2500亿担保 · 开源权重保卫战 · AI资本开支失控 · 千名从业者呼吁放缓</div>
  <div class="footer-text">Hermes Agent 自动生成</div>
</body>
</html>
